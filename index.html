<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Entry Form</title>
</head>
<body>

<h1>Student Entry Form</h1>

<div class="container">
    <input type="text" id="name" placeholder="Enter name" value="cale">
    <input type="number" id="age" placeholder="Enter age" value="16">
    <input type="text" id="email" placeholder="Enter student email" value="calemoher@gmail.com">
    <button onclick="addStudent()">Add Student</button>
</div>

<div class="student-list" id="studentList">
    <h2>Students:</h2>
</div>

<script>
    class Student {
        constructor(name, age, email) {
            this.name = name;
            this.age = age;
            this.email = email;
        }
    }

    const students = [];

    function addStudent() {
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const email = document.getElementById("email").value;

        if (!name || !age || !email) {
            alert("Please fill out all fields.");
            return;
        }

        const student = new Student(name, age, email);
        students.push(student);

        displayStudents();

        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("email").value = "";
    }

    function displayStudents() {
        const list = document.getElementById("studentList");
        list.innerHTML = "<h2>Students:</h2>";

        students.forEach((s, index) => {
            list.innerHTML += `
                <div class="student-item">
                    <strong>${index + 1}.</strong> 
                    ${s.name}, Age: ${s.age}, Email: ${s.email}
                </div>
            `;
        });
    }
</script>

</body>
</html>
